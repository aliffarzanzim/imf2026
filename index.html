<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Internal Medicine Festival 2026 — Inspiring the Future of Internal Medicine. Register now for this free event on 17 September 2026, organized by DMC IMIG, ACP Bangladesh Chapter, and Bangladesh Society of Medicine." />
    <meta name="keywords" content="Internal Medicine Festival, IMF 2026, DMC IMIG, ACP Bangladesh, BSM, medical students, clinical reasoning, abstract submission" />
    <meta property="og:title" content="Internal Medicine Festival 2026" />
    <meta property="og:description" content="Inspiring the Future of Internal Medicine — 17 September 2026. Free registration for all medical students." />
    <meta property="og:type" content="website" />
    <title>Internal Medicine Festival 2026 (IMF 2026) — DMC IMIG × ACP Bangladesh × BSM</title>

    <!-- Preload Critical Fonts for zero layout shift / zero font flicker -->
    <link rel="preload" href="/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Render-blocking CSS to guarantee zero FOUC / styling flicker on initial frame -->
    <link rel="stylesheet" href="/src/styles/globals.css" />
    <link rel="stylesheet" href="/src/styles/tailwind.css" />

    <!-- Instant Config Cache Initialization (eliminates any button toggle flicker) -->
    <script>
      try {
        var _c = localStorage.getItem("imf_system_config");
        if (_c && !window.__IMF_CONFIG__) {
          window.__IMF_CONFIG__ = JSON.parse(_c);
        }
      } catch (_) {}
    </script>
  </head>
  <body style="background-color: #f8fafc; margin: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

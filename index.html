<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Internal Medicine Festival 2026 — Inspiring the Future of Internal Medicine. Register now for this free event on 17 September 2026, organized by DMC IMIG, ACP Bangladesh Chapter, and Bangladesh Society of Medicine." />
    <meta name="keywords" content="Internal Medicine Festival, IMF 2026, DMC IMIG, ACP Bangladesh, BSM, medical students, clinical reasoning, abstract submission" />
    <meta property="og:title" content="Internal Medicine Festival 2026" />
    <meta property="og:description" content="Inspiring the Future of Internal Medicine — 17 September 2026. Free registration for all medical students." />
    <meta property="og:type" content="website" />
    <title>Internal Medicine Festival 2026 (IMF 2026) — DMC IMIG × ACP Bangladesh × BSM</title>

    <!-- Preload Critical Fonts for zero layout shift / zero font flicker -->
    <link rel="preload" href="/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Render-blocking CSS to guarantee zero FOUC / styling flicker on initial frame -->
    <link rel="stylesheet" href="/src/styles/globals.css" />
    <link rel="stylesheet" href="/src/styles/tailwind.css" />

    <!-- Instant Config Cache Initialization (eliminates any button toggle flicker) -->
    <script>
      try {
        var _c = localStorage.getItem("imf_system_config");
        if (_c && !window.__IMF_CONFIG__) {
          window.__IMF_CONFIG__ = JSON.parse(_c);
        }
      } catch (_) {}
    </script>
  </head>
  <body style="background-color: #020617; margin: 0;">
    <!-- No-JavaScript hard-block overlay (shown only when JS is disabled) -->
    <noscript>
      <div style="
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: #020617;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      ">
        <div style="
          width: 80px;
          height: 80px;
          border-radius: 24px;
          background: linear-gradient(135deg, rgba(244,63,94,0.25), rgba(251,191,36,0.15));
          border: 2px solid rgba(244,63,94,0.5);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 2.5rem;
          margin-bottom: 1.5rem;
        ">⚠️</div>
        <span style="
          display: inline-block;
          padding: 0.25rem 1rem;
          border-radius: 9999px;
          background: rgba(244,63,94,0.1);
          color: #f87171;
          border: 1px solid rgba(244,63,94,0.3);
          font-size: 0.7rem;
          font-weight: 800;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          margin-bottom: 1rem;
        ">JavaScript Required</span>
        <h1 style="color:#ffffff; font-size:1.5rem; font-weight:900; margin:0 0 0.75rem; line-height:1.3;">
          JavaScript is Disabled
        </h1>
        <p style="color:#94a3b8; font-size:0.9rem; max-width:380px; line-height:1.6; margin:0 0 1.5rem;">
          The IMF 2026 Quiz requires JavaScript to run. Please enable JavaScript
          in your browser settings and refresh the page to continue.
        </p>
        <div style="
          background: #0f172a;
          border: 1px solid #1e293b;
          border-radius: 16px;
          padding: 1rem 1.25rem;
          max-width: 360px;
          text-align: left;
          color: #64748b;
          font-size: 0.8rem;
          line-height: 1.7;
        ">
          <strong style="color:#e2e8f0;">To enable JavaScript:</strong><br/>
          Chrome / Edge: Settings → Privacy → Site Settings → JavaScript → Allow<br/>
          Firefox: Address bar → about:config → javascript.enabled → true
        </div>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

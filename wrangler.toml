name = "imf2026"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "imf-db"
database_id = "db75abbe-7614-4480-805c-c7b5164e2256"

# R2 Bucket Binding
[[r2_buckets]]
binding = "ABSTRACTS_BUCKET"
bucket_name = "imf-abstracts"

[vars]
R2_BUCKET_NAME = "imf-abstracts"
# ─────────────────────────────────────────────────────────────
# DO NOT add secrets here. Set them via Wrangler CLI:
#   npx wrangler secret put CF_ACCOUNT_ID
#   npx wrangler secret put R2_ACCESS_KEY_ID
#   npx wrangler secret put R2_SECRET_ACCESS_KEY
#   npx wrangler secret put ADMIN_PASSWORD
# ─────────────────────────────────────────────────────────────
